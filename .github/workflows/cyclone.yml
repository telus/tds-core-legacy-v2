name: cyclone 
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    name: Install and build javascript
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: sudo apt-get install python2
      - run: npm install @babel/plugin-transform-optional-catch-binding@latest
      - run: npm install @babel/plugin-transform-class-properties@latest
      - run: npm install @babel/plugin-transform-async-generator-functions@latest
      - run: npm install @babel/plugin-transform-object-rest-spread@latest
      - run: npm install mkdirp@latest
      - run: npm install debug@latest
      - run: npm install kleur@latest
      - run: npm install core-js@latest
      - run: npm install node-gyp@latest
      - run: npm install
      - name: Create SBOM with CycloneDX
        uses: CycloneDX/gh-node-module-generatebom@v1
        with: 
          output: './test.app.bom.xml'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: ./test.app.bom.xml